<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChartedX</title>
<style>
  :root { --bg: #0f1115; --card: #181b22; --line: #2a2f3a; --text: #e8eaf0; --muted: #9aa1b2; --accent: #7b5cff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 120px; }
  h1 { margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 16px; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  input[type=search] { flex: 1; min-width: 180px; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  button { padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); margin-bottom: 6px; }
  .row b { min-width: 160px; }
  .row label { margin-left: 12px; color: var(--muted); white-space: nowrap; }
  .row label:has(input:checked) { color: var(--text); }
  .src { font-size: 12px; color: var(--muted); font-weight: normal; }
  .types { padding-left: 12px; border-left: 1px solid var(--line); }
  .row b { flex: 1; }
  .move { display: flex; flex-direction: column; }
  .move button { padding: 0 6px; font-size: 10px; line-height: 14px; border: 0; background: none; color: var(--muted); }
  .move button:hover { color: var(--text); }
  footer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--line); padding: 12px 16px; }
  footer div { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .primary { background: var(--accent); border-color: var(--accent); font-weight: 600; }
  #count { color: var(--muted); margin-right: auto; }
</style>
</head>
<body>
<main>
  <h1>ChartedX</h1>
  <p>Escolhe as plataformas e as listas. «Top 10» = FlixPatrol diário (igual à app) ou, sem FlixPatrol, o top semanal do JustWatch. Populares e Tendências vêm do JustWatch.</p>
  <div class="tools">
    <input type="search" id="q" placeholder="Procurar plataforma…">
    <button id="tops">Todos os Top 10</button>
    <button id="none">Limpar</button>
  </div>
  <div id="list">A carregar…</div>
</main>
<footer><div>
  <span id="count"></span>
  <button id="copy">Copiar link</button>
  <button id="install" class="primary">Instalar no Stremio</button>
</div></footer>
<script>
const LISTS = [['top', 'Top 10'], ['popular', 'Populares'], ['trending', 'Tendências']];
const sn = id => id.slice(0, id.lastIndexOf('-'));
// config from /{config}/configure, if reinstalling: entries "nfx-top", "sic-popular.m" (movies only), "nfx-trending.s" (series only)
const first = location.pathname.split('/').filter(Boolean)[0];
const saved = first && first !== 'configure' ? decodeURIComponent(first).split(',') : [];
const picked = saved.map(e => e.split('.')[0]);
const savedType = Object.fromEntries(saved.map(e => [sn(e.split('.')[0]), e.split('.')[1]])); // provider -> 'm' | 's' | undefined
const savedOrder = [...new Set(picked.map(sn))];

const list = document.getElementById('list');
fetch('/manifest.json').then(r => r.json()).then(m => {
  const providers = new Map(); // sn -> {name, lists:Set, source}
  for (const c of m.catalogs) {
    const [sn, list] = [c.id.slice(0, c.id.lastIndexOf('-')), c.id.slice(c.id.lastIndexOf('-') + 1)];
    const p = providers.get(sn) || { name: c.name.split(' · ')[0], lists: new Set(), jw: false };
    p.lists.add(list);
    if (list === 'top' && c.name.endsWith('Top JustWatch')) p.jw = true;
    providers.set(sn, p);
  }
  // previously picked providers first, in their saved order
  const rank = id => (savedOrder.indexOf(id) + 1) || Infinity;
  list.innerHTML = [...providers].sort(([a], [b]) => rank(a) - rank(b)).map(([id, p]) => `
    <div class="row" data-sn="${id}" data-name="${p.name.toLowerCase()}">
      <span class="move"><button data-move="-1" title="Subir">▲</button><button data-move="1" title="Descer">▼</button></span>
      <b>${p.name}${p.lists.has('top') ? ` <span class="src">${p.jw ? 'JustWatch' : 'FlixPatrol'}</span>` : ''}</b>
      <span>${LISTS.filter(([l]) => p.lists.has(l)).map(([l, label]) =>
        `<label><input type="checkbox" class="list" value="${id}-${l}" ${picked.includes(`${id}-${l}`) ? 'checked' : ''}> ${label}</label>`).join('')}
        <span class="types">
          <label><input type="checkbox" class="type" value="m" ${savedType[id] !== 's' ? 'checked' : ''}> Filmes</label>
          <label><input type="checkbox" class="type" value="s" ${savedType[id] !== 'm' ? 'checked' : ''}> Séries</label>
        </span></span>
    </div>`).join('');
  update();
});

const boxes = () => [...list.querySelectorAll('input.list')];
const rows = () => [...list.querySelectorAll('.row')];
const isOn = row => row.querySelector('input.list:checked');
// '' = movies and series, '.m' / '.s' = one type, null = neither
function typeOf(row) {
  const [m, s] = [...row.querySelectorAll('input.type')].map(b => b.checked);
  return m && s ? '' : m ? '.m' : s ? '.s' : null;
}
// Stremio board order = row order on this page, then Top 10 / Populares / Tendências within a provider
const entries = () => rows().filter(r => typeOf(r) !== null)
  .flatMap(r => [...r.querySelectorAll('input.list:checked')].map(b => b.value + typeOf(r)));
function update() {
  const n = entries().reduce((sum, e) => sum + (e.includes('.') ? 1 : 2), 0);
  document.getElementById('count').textContent = `${n} filas no Stremio`;
}
const url = () => `${location.host}/${entries().join(',')}/manifest.json`;
list.addEventListener('change', e => {
  const row = e.target.closest('.row');
  // a provider just picked joins the end of the picked block at the top
  if (e.target.classList.contains('list') && e.target.checked && row.querySelectorAll('input.list:checked').length === 1) {
    const lastOn = rows().filter(r => r !== row && isOn(r)).pop();
    lastOn ? lastOn.after(row) : list.prepend(row);
  }
  update();
});
list.addEventListener('click', e => {
  const step = +e.target.dataset.move;
  if (!step) return;
  const row = e.target.closest('.row');
  const sibling = step < 0 ? row.previousElementSibling : row.nextElementSibling;
  if (sibling) step < 0 ? sibling.before(row) : sibling.after(row);
  update();
});
document.getElementById('q').addEventListener('input', e => document.querySelectorAll('.row').forEach(r => { r.hidden = !r.dataset.name.includes(e.target.value.toLowerCase()); }));
document.getElementById('tops').onclick = () => { boxes().forEach(b => { if (b.value.endsWith('-top')) b.checked = true; }); update(); };
document.getElementById('none').onclick = () => { boxes().forEach(b => { b.checked = false; }); update(); };
document.getElementById('install').onclick = async e => {
  if (!entries().length) return;
  if (location.protocol === 'https:') return void (location.href = `stremio://${url()}`);
  // stremio:// always becomes https:// (and drops the port), so a local http server can only be added by pasting the link
  await navigator.clipboard.writeText(`http://${url()}`).catch(() => {});
  e.target.textContent = 'Link copiado: cola em Add-ons no Stremio';
  setTimeout(() => { e.target.textContent = 'Instalar no Stremio'; }, 4000);
};
document.getElementById('copy').onclick = async e => {
  if (!entries().length) return;
  await navigator.clipboard.writeText(`${location.protocol}//${url()}`).catch(() => {});
  e.target.textContent = 'Copiado';
  setTimeout(() => { e.target.textContent = 'Copiar link'; }, 1500);
};
</script>
</body>
</html>
