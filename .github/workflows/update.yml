name: update
on:
  # FlixPatrol publishes ~11:00 UTC (its FAQ), Netflix again 14:00–16:00 UTC; JustWatch's daily chart ~05:20 UTC
  schedule: [{ cron: '30 11 * * *' }, { cron: '30 16 * * *' }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node update.js
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - run: |
          # commits as the repo owner: Vercel (free plan) blocks deploys of commits by other authors, like github-actions
          git config user.name PlinKo182
          git config user.email 21090796+PlinKo182@users.noreply.github.com
          git add docs cache.json
          git diff --cached --quiet || git commit -m "update $(date -u +%F)"
          git pull --rebase -X theirs && git push # main may have moved while this ran; on a docs/ conflict keep this run's data
